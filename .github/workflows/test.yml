name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  kicad-8:
    name: KiCad 8
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user root  # required so checkout works
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: |
          chmod -R a+rX .
          id
          ls -la tests/
          python3 -c "import os; print('Exists:', os.path.exists('tests/UsbSublayout.kicad_pcb'))"
          python3 -m unittest
